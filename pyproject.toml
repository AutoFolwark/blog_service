[project]
name = "blog-service"
version = "0.1.0"
description = "Bidmax blog service"
authors = [
    {name = "peyro",email = "peyrovskaaa@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi[all] (>=0.115.12,<0.116.0)",
    "python-dotenv (>=1.1.0,<2.0.0)",
    "fastapi-cache2 (>=0.2.2,<0.3.0)",
    "redis (>=6.2.0,<7.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic-settings (>=2.10.1,<3.0.0)",
    "fastapi-problem (>=0.11.4,<0.12.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "alembic (>=1.16.4,<2.0.0)",
    "sqlalchemy (>=2.0.0,<3.0.0)",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "greenlet (>=3.2.4,<4.0.0)",
    "infisicalsdk (>=1.0.17,<2.0.0)",
    "boto3 (>=1.43.108,<2.0.0)",
    "authtools @ git+https://github.com/AutoFolwark/shared_auth.git@v0.1.8",
    "googletrans (>=4.0.2,<5.0.0)",
    "apscheduler (>=3.11.0,<4.0.0)",
    "python-slugify (>=9.1.0,<10.0.0)",
    "beautifulsoup4 (>=4.13.0,<5.0.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
aiosqlite = "^0.21.0"
pytest = "^8.4.1"
boto3-stubs = ">=1.43.108,<1.44.0"
ruff = "0.17.0"
pre-commit = "^4.6.2"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["."]

[tool.ruff.lint]
select = ["I"]
